name: SendbirdBinaryFrameworks

options:
  bundleIdPrefix: com.sendbird
  deploymentTarget:
    iOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: "14.0"
    BUILD_LIBRARY_FOR_DISTRIBUTION: "YES"
    SKIP_INSTALL: "NO"
    SWIFT_VERSION: "5.7"
    DEFINES_MODULE: "YES"
    GENERATE_INFOPLIST_FILE: "YES"
    MACH_O_TYPE: staticlib
    # 단일 오브젝트 프리링크. 아카이브 멤버 단위로 링크되면 protocol conformance
    # 레코드만 가진 오브젝트(예: BlockNode+View.o)가 참조 심볼이 없어 버려지고,
    # 런타임에 swift_conformsToProtocol 이 실패해 크래시한다. 한 덩어리로 묶으면
    # 어떤 심볼이든 참조될 때 모듈 전체가 들어온다.
    GENERATE_MASTER_OBJECT_FILE: "YES"
    ENABLE_BITCODE: "NO"
    CODE_SIGNING_ALLOWED: "NO"

targets:
  SendbirdNetworkImage:
    type: framework
    platform: iOS
    sources:
      - path: Sources/NetworkImage/Sources/NetworkImage
    settings:
      base:
        PRODUCT_NAME: SendbirdNetworkImage
        PRODUCT_BUNDLE_IDENTIFIER: com.sendbird.SendbirdNetworkImage

  SendbirdMarkdownUI:
    type: framework
    platform: iOS
    sources:
      - path: Sources/MarkdownUI/Sources/MarkdownUI
        excludes:
          - "Documentation.docc"
      - path: Sources/MarkdownUI/ThirdParty/cmark-gfm
        excludes:
          - "**/CMakeLists.txt"
          - "**/*.re"
          - "**/*.inc"
          - "**/*.in"
          - "**/module.modulemap"
      - path: Sources/MarkdownUI/ThirdParty/cmark-gfm-extensions
        excludes:
          - "**/CMakeLists.txt"
          - "**/*.re"
          - "**/*.inc"
          - "**/*.in"
          - "**/module.modulemap"
    dependencies:
      - target: SendbirdNetworkImage
    settings:
      base:
        PRODUCT_NAME: SendbirdMarkdownUI
        PRODUCT_BUNDLE_IDENTIFIER: com.sendbird.SendbirdMarkdownUI
        SWIFT_INCLUDE_PATHS: "$(SRCROOT)/Sources/MarkdownUI/ThirdParty/cmark-gfm/include $(SRCROOT)/Sources/MarkdownUI/ThirdParty/cmark-gfm-extensions/include"
        HEADER_SEARCH_PATHS: "$(SRCROOT)/Sources/MarkdownUI/ThirdParty/cmark-gfm/include $(SRCROOT)/Sources/MarkdownUI/ThirdParty/cmark-gfm/src $(SRCROOT)/Sources/MarkdownUI/ThirdParty/cmark-gfm-extensions/include $(SRCROOT)/Sources/MarkdownUI/ThirdParty/cmark-gfm-extensions/src"
        GCC_PREPROCESSOR_DEFINITIONS: "$(inherited) CMARK_GFM_STATIC_DEFINE=1 CMARK_THREADING=1"

  # Package.swift 의 testTarget 자리를 대신한다. MarkdownUI 가 바이너리가 되면
  # @testable import 가 불가능해서 SwiftPM 테스트 타깃을 유지할 수 없다.
  SendbirdMarkdownUITests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Sources/MarkdownUI/Tests/MarkdownUITests
    dependencies:
      - target: SendbirdMarkdownUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sendbird.SendbirdMarkdownUITests
        MACH_O_TYPE: mh_bundle
        BUILD_LIBRARY_FOR_DISTRIBUTION: "NO"
        GENERATE_INFOPLIST_FILE: "YES"
