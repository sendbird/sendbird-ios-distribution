# CocoaPods 용 바이너리 프레임워크.
#
# SPM 용(binary-frameworks.yml, splash-framework.yml)과 두 가지가 다르다.
#
# 1. 동적(dynamic)이다. CocoaPods 고객은 `use_frameworks!` 로 통합하는데,
#    정적 vendored_frameworks 를 섞으면 pod install 이 거부한다.
#    SPM 쪽이 정적인 이유는 SendbirdAIAgentCore.xcframework 안에 흡수시키기
#    위해서였고, CocoaPods 는 잎 모듈을 별도 프레임워크로 받는다.
# 2. Splash 는 이 레포의 Sources/Splash 포크를 쓴다. 업스트림과 달리 `any`
#    키워드 하이라이팅이 있고, 기존 CocoaPods 고객이 받던 코드와 같아야 한다.
#    SPM 은 업스트림 0.16.0 을 쓴다.
#
# 동적이라 GENERATE_MASTER_OBJECT_FILE 은 필요 없다. 그 설정은 정적 아카이브에서
# conformance 전용 오브젝트가 버려지는 것을 막으려던 것이다.
name: SendbirdBinaryFrameworksCocoaPods

options:
  bundleIdPrefix: com.sendbird
  deploymentTarget:
    iOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: "14.0"
    BUILD_LIBRARY_FOR_DISTRIBUTION: "YES"
    SKIP_INSTALL: "NO"
    SWIFT_VERSION: "5.7"
    DEFINES_MODULE: "YES"
    GENERATE_INFOPLIST_FILE: "YES"
    ENABLE_BITCODE: "NO"
    CODE_SIGNING_ALLOWED: "NO"

targets:
  SendbirdNetworkImage:
    type: framework
    platform: iOS
    sources:
      - path: Sources/NetworkImage/Sources/NetworkImage
    settings:
      base:
        PRODUCT_NAME: SendbirdNetworkImage
        PRODUCT_BUNDLE_IDENTIFIER: com.sendbird.SendbirdNetworkImage

  SendbirdMarkdownUI:
    type: framework
    platform: iOS
    sources:
      - path: Sources/MarkdownUI/Sources/MarkdownUI
        excludes:
          - "Documentation.docc"
      - path: Sources/MarkdownUI/ThirdParty/cmark-gfm
        excludes:
          - "**/CMakeLists.txt"
          - "**/*.re"
          - "**/*.inc"
          - "**/*.in"
          - "**/module.modulemap"
      - path: Sources/MarkdownUI/ThirdParty/cmark-gfm-extensions
        excludes:
          - "**/CMakeLists.txt"
          - "**/*.re"
          - "**/*.inc"
          - "**/*.in"
          - "**/module.modulemap"
    dependencies:
      - target: SendbirdNetworkImage
    settings:
      base:
        PRODUCT_NAME: SendbirdMarkdownUI
        PRODUCT_BUNDLE_IDENTIFIER: com.sendbird.SendbirdMarkdownUI
        SWIFT_INCLUDE_PATHS: "$(SRCROOT)/Sources/MarkdownUI/ThirdParty/cmark-gfm/include $(SRCROOT)/Sources/MarkdownUI/ThirdParty/cmark-gfm-extensions/include"
        HEADER_SEARCH_PATHS: "$(SRCROOT)/Sources/MarkdownUI/ThirdParty/cmark-gfm/include $(SRCROOT)/Sources/MarkdownUI/ThirdParty/cmark-gfm/src $(SRCROOT)/Sources/MarkdownUI/ThirdParty/cmark-gfm-extensions/include $(SRCROOT)/Sources/MarkdownUI/ThirdParty/cmark-gfm-extensions/src"
        GCC_PREPROCESSOR_DEFINITIONS: "$(inherited) CMARK_GFM_STATIC_DEFINE=1 CMARK_THREADING=1"

  SendbirdSplash:
    type: framework
    platform: iOS
    sources:
      - path: Sources/Splash/Sources/Splash
    settings:
      base:
        PRODUCT_NAME: Splash
        PRODUCT_BUNDLE_IDENTIFIER: com.sendbird.SendbirdSplash
