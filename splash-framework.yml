name: SplashBinary
options:
  bundleIdPrefix: com.sendbird
  deploymentTarget:
    iOS: "14.0"
settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: "14.0"
    BUILD_LIBRARY_FOR_DISTRIBUTION: "YES"
    SKIP_INSTALL: "NO"
    SWIFT_VERSION: "5.7"
    DEFINES_MODULE: "YES"
    GENERATE_INFOPLIST_FILE: "YES"
    MACH_O_TYPE: staticlib
    # 단일 오브젝트 프리링크. 아카이브 멤버 단위로 링크되면 protocol conformance
    # 레코드만 가진 오브젝트(예: BlockNode+View.o)가 참조 심볼이 없어 버려지고,
    # 런타임에 swift_conformsToProtocol 이 실패해 크래시한다. 한 덩어리로 묶으면
    # 어떤 심볼이든 참조될 때 모듈 전체가 들어온다.
    GENERATE_MASTER_OBJECT_FILE: "YES"
    CODE_SIGNING_ALLOWED: "NO"
targets:
  Splash:
    type: framework
    platform: iOS
    sources:
      - path: Sources/Splash
    settings:
      base:
        PRODUCT_NAME: Splash
        PRODUCT_BUNDLE_IDENTIFIER: com.sendbird.Splash
