name: SplashBinary
options:
  bundleIdPrefix: com.sendbird
  deploymentTarget:
    iOS: "14.0"
settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: "14.0"
    BUILD_LIBRARY_FOR_DISTRIBUTION: "YES"
    SKIP_INSTALL: "NO"
    SWIFT_VERSION: "5.7"
    DEFINES_MODULE: "YES"
    GENERATE_INFOPLIST_FILE: "YES"
    # binary-frameworks.yml 과 같은 이유로 동적 프레임워크다. 그 파일의 주석 참고.
    MACH_O_TYPE: mh_dylib
    DYLIB_INSTALL_NAME_BASE: "@rpath"
    DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
    CODE_SIGNING_ALLOWED: "NO"
targets:
  Splash:
    type: framework
    platform: iOS
    sources:
      - path: Sources/Splash
    settings:
      base:
        PRODUCT_NAME: Splash
        PRODUCT_BUNDLE_IDENTIFIER: com.sendbird.Splash
